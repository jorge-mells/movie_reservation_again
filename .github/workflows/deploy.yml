name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  start-deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    permissions:
      deployments: write
      contents: read
      packages: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    steps:
      - name: Start GitHub Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          env: production
          ref: ${{ github.event.workflow_run.head_branch }}

  publish:
    runs-on: ubuntu-latest
    needs: start-deploy
    permissions:
      packages: write
      contents: read
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_branch }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    strategy:
      matrix:
        host: ${{ fromJSON(vars.DEPLOY_HOSTS) }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}

      - name: Add hosts to known_hosts
        run: |
          echo "${{ matrix.host.ip }}" | xargs ssh-keyscan >> ~/.ssh/known_hosts

      - name: Deploy to SSH
        run: ssh ${{ matrix.host.user }}@${{ matrix.host.ip }} '${{ needs.publish.outputs.image_digest }}'

  end-deploy:
    runs-on: ubuntu-latest
    needs: [start-deploy, deploy]
    if: always() && needs.start-deploy.result != 'skipped'
    permissions:
      deployments: write
    steps:
      - name: Update Deployment Status
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: ${{ needs.deploy.result }}
          env: production
          deployment_id: ${{ needs.start-deploy.outputs.deployment_id }}
